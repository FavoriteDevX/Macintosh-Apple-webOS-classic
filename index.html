<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macintosh 1984 System 1 Replica</title>
    <style>
        /* Retro Monochrome Font & Reset */
        @import url('https://googleapis.com');

        :root {
            --mac-black: #000000;
            --mac-white: #ffffff;
            --mac-pattern: #555555;
            --menu-height: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
            user-select: none;
        }

        body {
            font-family: 'Courier Prime', monospace; /* Fallback for Chicago font look */
            font-size: 12px;
            background-color: var(--mac-pattern);
            /* Original 50% gray desktop pattern */
            background-image: max(2px, 10%) radial-gradient(var(--mac-black) 25%, transparent 25%),
                              radial-gradient(var(--mac-black) 25%, transparent 25%);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            overflow: hidden;
            width: 100vw;
            height: 100vw;
        }

        /* Top Menu Bar */
        #menu-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--menu-height);
            background: var(--mac-white);
            border-bottom: 1px solid var(--mac-black);
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 9999;
        }

        .menu-item {
            padding: 0 10px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }

        .menu-item:hover {
            background: var(--mac-black);
            color: var(--mac-white);
        }

        .apple-icon {
            font-size: 14px;
        }

        /* Desktop Icons Container */
        #desktop {
            position: absolute;
            top: var(--menu-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--menu-height));
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 25px;
        }

        .icon {
            width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .icon-image {
            width: 32px;
            height: 32px;
            border: 2px solid var(--mac-black);
            background: var(--mac-white);
            margin-bottom: 4px;
            position: relative;
        }

        /* Simulating pixelated icons */
        .icon-image.disk::before {
            content: '';
            position: absolute;
            top: 4px; left: 6px; right: 6px; bottom: 2px;
            border: 2px solid var(--mac-black);
        }

        .icon-text {
            background: var(--mac-white);
            padding: 1px 3px;
            border: 1px solid transparent;
        }

        .icon.selected .icon-image {
            background: var(--mac-black);
        }
        .icon.selected .icon-text {
            background: var(--mac-black);
            color: var(--mac-white);
            border: 1px dotted var(--mac-white);
        }

        /* Classic Mac OS Window Constraints */
        .mac-window {
            position: absolute;
            background: var(--mac-white);
            border: 1px solid var(--mac-black);
            box-shadow: 2px 2px 0px var(--mac-black);
            display: flex;
            flex-direction: column;
            min-width: 200px;
            min-height: 150px;
            z-index: 10;
        }

        .window-titlebar {
            height: 18px;
            background: var(--mac-white);
            border-bottom: 1px solid var(--mac-black);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: move;
            /* Horizontal lines texture */
            background-image: linear-gradient(var(--mac-black) 1px, transparent 1px);
            background-size: 100% 3px;
            padding: 0 20px;
        }

        .window-title {
            background: var(--mac-white);
            padding: 0 6px;
            font-weight: bold;
            z-index: 2;
        }

        .close-box {
            position: absolute;
            left: 6px;
            top: 3px;
            width: 11px;
            height: 11px;
            border: 1px solid var(--mac-black);
            background: var(--mac-white);
            cursor: pointer;
            z-index: 3;
        }

        .window-content {
            padding: 10px;
            flex-grow: 1;
            overflow: auto;
            background: var(--mac-white);
        }

        /* Calculator App Styles */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            max-width: 160px;
        }
        .calc-screen {
            grid-column: span 4;
            border: 1px solid var(--mac-black);
            text-align: right;
            padding: 4px;
            margin-bottom: 6px;
            font-size: 14px;
            min-height: 24px;
        }
        .calc-btn {
            border: 1px solid var(--mac-black);
            background: var(--mac-white);
            padding: 6px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }
        .calc-btn:active {
            background: var(--mac-black);
            color: var(--mac-white);
        }
    </style>
</head>
<body>

    <!-- OS Top Menu Bar -->
    <div id="menu-bar">
        <div class="menu-item apple-icon"></div>
        <div class="menu-item" onclick="WindowManager.createWindow('Finder', 'System Folder contents: System (212K), Finder (46K).')">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item" onclick="WindowManager.createWindow('About', 'Macintosh System 1.0\nMemory: 128K\n© 1984 Apple Computer')">Special</div>
    </div>

    <!-- OS Desktop Workspace -->
    <div id="desktop" onclick="Desktop.clearSelection(event)">
        <div class="icon" id="icon-macman" onclick="Desktop.selectIcon(this, event)" ondblclick="WindowManager.createWindow('Macintosh HD', 'Folders inside:\n- System Folder\n- Applications\n- Empty Folder')">
            <div class="icon-image disk"></div>
            <div class="icon-text">Macintosh HD</div>
        </div>
        
        <div class="icon" id="icon-calc" onclick="Desktop.selectIcon(this, event)" ondblclick="WindowManager.openCalculator()">
            <div class="icon-image"></div>
            <div class="icon-text">Calculator</div>
        </div>
    </div>

    <script>
        /**
         * Global Desktop Manager State
         */
        const Desktop = {
            selectedIcon: null,
            selectIcon(element, event) {
                event.stopPropagation();
                this.clearSelection();
                this.selectedIcon = element;
                element.classList.add('selected');
            },
            clearSelection(event) {
                if (this.selectedIcon) {
                    this.selectedIcon.classList.remove('selected');
                    this.selectedIcon = null;
                }
            }
        };

        /**
         * Window Management Architecture (Z-Index, Drag & Drop, Dynamic Injection)
         */
        const WindowManager = {
            activeWindow: null,
            topZIndex: 100,

            createWindow(title, contentHTML) {
                // Prevent duplicate window openings for unique apps
                const existing = document.getElementById(`win-${title.replace(/\s+/g, '')}`);
                if (existing) {
                    this.focusWindow(existing);
                    return;
                }

                this.topZIndex++;
                const win = document.createElement('div');
                win.id = `win-${title.replace(/\s+/g, '')}`;
                win.className = 'mac-window';
                win.style.left = '60px';
                win.style.top = '80px';
                win.style.zIndex = this.topZIndex;

                win.innerHTML = `
                    <div class="window-titlebar" onmousedown="WindowManager.startDrag(event, this.parentElement)">
                        <div class="close-box" onclick="this.parentElement.parentElement.remove()"></div>
                        <div class="window-title">${title}</div>
                    </div>
                    <div class="window-content">${contentHTML.replace(/\n/g, '<br>')}</div>
                `;

                win.addEventListener('mousedown', () => this.focusWindow(win));
                document.body.appendChild(win);
                this.activeWindow = win;
            },

            focusWindow(win) {
                if (this.activeWindow !== win) {
                    this.topZIndex++;
                    win.style.zIndex = this.topZIndex;
                    this.activeWindow = win;
                }
            },

            startDrag(event, win) {
                event.preventDefault();
                this.focusWindow(win);
                
                let startX = event.clientX;
                let startY = event.clientY;
                let origX = win.offsetLeft;
                let origY = win.offsetTop;

                const doDrag = (e) => {
                    win.style.left = (origX + e.clientX - startX) + 'px';
                    win.style.top = (origY + e.clientY - startY) + 'px';
                };

  const stopDrag = () => {
document.removeEventListener('mousemove', doDrag);
document.removeEventListener('mouseup', stopDrag);
};
document.addEventListener('mousemove', doDrag);
document.addEventListener('mouseup', stopDrag);
},
openCalculator() {
const calcHTML = <div class="calc-screen" id="calc-display">0</div> <div class="calc-grid"> <div class="calc-btn" onclick="MacCalc.clear()">C</div> <div class="calc-btn" onclick="MacCalc.press('/')">/</div> <div class="calc-btn" onclick="MacCalc.press('*')">*</div> <div class="calc-btn" onclick="MacCalc.press('-')">-</div> <div class="calc-btn" onclick="MacCalc.press('7')">7</div> <div class="calc-btn" onclick="MacCalc.press('8')">8</div> <div class="calc-btn" onclick="MacCalc.press('9')">9</div> <div class="calc-btn" onclick="MacCalc.press('+')">+</div> <div class="calc-btn" onclick="MacCalc.press('4')">4</div> <div class="calc-btn" onclick="MacCalc.press('5')">5</div> <div class="calc-btn" onclick="MacCalc.press('6')">6</div> <div class="calc-btn" onclick="MacCalc.eval()">=</div> <div class="calc-btn" onclick="MacCalc.press('1')">1</div> <div class="calc-btn" onclick="MacCalc.press('2')">2</div> <div class="calc-btn" onclick="MacCalc.press('3')">3</div> <div class="calc-btn" onclick="MacCalc.press('0')">0</div> </div>;
this.createWindow('Calculator', calcHTML);
}
};
/**
* State Machine Functional Calculator Accent
*/
const MacCalc = {
buffer: '',
press(char) {
this.buffer += char;
document.getElementById('calc-display').innerText = this.buffer;
},
clear() {
this.buffer = '';
document.getElementById('calc-display').innerText = '0';
},
eval() {
try {
// Safe evaluation for basic operations
const res = Function("use strict"; return (${this.buffer}))();
this.buffer = String(res);
document.getElementById('calc-display').innerText = this.buffer;
} catch(e) {
document.getElementById('calc-display').innerText = 'Error';
this.buffer = '';
}
}
};
